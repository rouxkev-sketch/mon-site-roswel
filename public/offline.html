<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hors ligne · YokoFolio</title>
  <!--
    Page affichée quand la connexion est coupée.
    Fichier autonome : les couleurs reprennent celles du fichier
    de réglages central (src/config/tatouage.ts).
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #101B33;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .carte { max-width: 320px; }
    .icone img {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #5B6472; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #EE3D6F;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px; /* zone tactile confortable */
    }
  </style>
</head>
<body>
  <div class="carte">
    <div class="icone">
      <!-- Le logo définitif, mis en cache par le service worker
           pour rester visible même sans connexion -->
      <img src="/yokofolio-icone.png" alt="" width="72" height="72" />
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre YokoFolio pour le moment. Vérifiez votre connexion internet puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
